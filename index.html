<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Island Defense</title>
<meta name="description" content="Island Defense: one island, one tower, every shore.">
<link rel="icon" href="emblem.png">
<style>
  :root { --bg: #f4f8fb; --ink: #10263a; --muted: #4c6277; --accent: #0a6fb8; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #061e32; --ink: #e8f1f8; --muted: #a6bccf; --accent: #6cc1ff; }
  }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: var(--bg); color: var(--ink); text-align: center;
    font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }
  main { padding: 32px 16px; }
  img { width: 128px; height: 128px; border-radius: 28px; }
  h1 { margin: 16px 0 4px; }
  p { color: var(--muted); margin: 0 0 24px; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <img src="emblem.png" alt="Island Defense emblem">
  <h1>Island Defense</h1>
  <p>One island, one tower, every shore.</p>
  <a href="privacy">Privacy Policy</a> · <a href="mailto:adjiesantooso@gmail.com">Contact</a>
</main>
</body>
</html>
